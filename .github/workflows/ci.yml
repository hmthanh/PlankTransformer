name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Test core library
  test-core:
    name: Test Core Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache target directory
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run tests
        run: |
          cd crates/transformer-core
          cargo test --verbose
      
      - name: Run FFI tests
        run: |
          cd crates/transformer-ffi
          cargo test --verbose

  # Build desktop apps
  build-desktop:
    name: Build Desktop - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      
      - name: Build desktop app
        run: |
          cd apps/desktop
          cargo build --release --target ${{ matrix.target }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: transformer-desktop-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/transformer-desktop${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  # Build WASM for web
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      
      - name: Build WASM
        run: |
          cd apps/web
          wasm-pack build --target web --out-dir pkg
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: transformer-wasm
          path: apps/web/pkg/

  # Build iOS
  build-ios:
    name: Build iOS Library
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      
      - name: Build iOS libraries
        run: |
          cargo build --release --target aarch64-apple-ios --manifest-path crates/transformer-ffi/Cargo.toml
          cargo build --release --target aarch64-apple-ios-sim --manifest-path crates/transformer-ffi/Cargo.toml
          cargo build --release --target x86_64-apple-ios --manifest-path crates/transformer-ffi/Cargo.toml
      
      - name: Create XCFramework
        run: |
          cd apps/ios
          chmod +x build.sh
          ./build.sh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: transformer-ios-xcframework
          path: apps/ios/lib/TransformerFFI.xcframework/

  # Build Android
  build-android:
    name: Build Android Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      
      - name: Build Android libraries
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cd apps/android
          chmod +x build.sh
          ./build.sh
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: transformer-android-libs
          path: apps/android/app/src/main/jniLibs/

  # Lint and format check
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run security audit
        run: cargo audit

  # Release builds
  release:
    name: Create Release
    needs: [test-core, build-desktop, build-wasm, build-ios, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            transformer-desktop-*/*
            transformer-wasm/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
